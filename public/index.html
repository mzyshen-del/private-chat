<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私域实时聊天</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #718096;
      --brand: #12805c;
      --line: #e4e9f0;
      --me: #daf3e8;
      --shadow: 0 10px 28px rgba(16, 24, 40, 0.12);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 0%, #dff2ea, transparent 30%), var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(900px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: min(92vh, 760px);
      overflow: hidden;
    }

    .top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    input, button, textarea {
      font: inherit;
    }

    input {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    .secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .notice { margin: 0; color: #8a4b00; font-size: 12px; line-height: 1.5; }

    .status {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .messages {
      padding: 14px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(180deg, #fafdfb 0%, #f3f7fb 100%);
    }

    .msg {
      max-width: 80%;
      display: grid;
      gap: 4px;
    }

    .msg .bubble {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 11px;
      word-break: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    .msg .meta {
      font-size: 11px;
      color: var(--muted);
    }

    .msg.me {
      align-self: flex-end;
      justify-items: end;
    }

    .msg.me .bubble {
      background: var(--me);
      border-color: #bfe5d6;
    }

    .msg.system {
      align-self: center;
      justify-items: center;
      max-width: 100%;
    }

    .msg.system .bubble {
      background: #f1f5f9;
      font-size: 12px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 130px;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="top">
      <div style="font-weight:700;">邀请链接聊天室</div>
      <p class="notice">持有完整邀请链接的人可读取房间历史。此演示不适合敏感信息。</p>
      <div class="row">
        <input aria-label="你的昵称" id="nameInput" placeholder="你的昵称" maxlength="24" />
        <input aria-label="完整邀请链接" id="roomInput" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴完整邀请链接" />
        <button id="connectBtn" type="button">进入聊天</button>
      </div>
      <div class="row">
        <button id="createRoomBtn" class="secondary" type="button">创建房间</button>
        <button id="copyLinkBtn" class="secondary" type="button">复制邀请链接</button>
        <button id="clearBtn" class="secondary" type="button">清空当前输入</button>
      </div>
      <p class="notice">手机可直接打开邀请链接，或把完整链接粘贴到上方。单独房间号无法加入。</p>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">创建房间或打开邀请链接后进入聊天。持有邀请链接的人可读取房间历史；请勿分享敏感信息。</div>
    <section class="messages" id="messages"></section>

    <form class="composer" id="composer">
      <textarea aria-label="消息内容" id="textInput" maxlength="2000" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button type="submit">发送</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const roomInput = document.getElementById("roomInput");
    const connectBtn = document.getElementById("connectBtn");
    const createRoomBtn = document.getElementById("createRoomBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const textInput = document.getElementById("textInput");

    const socket = io();
    let connectedRoom = "";
    let connectedName = "";
    let activeInvite = null;

    const savedName = localStorage.getItem("chat_name") || "";
    nameInput.value = savedName;
    if (location.hash) roomInput.value = location.href;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function escapeHTML(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderMessage(item, mine) {
      const cls = item.system ? "msg system" : (mine ? "msg me" : "msg");
      const namePart = item.system ? "系统" : item.from;
      const timePart = formatTime(item.time || new Date().toISOString());
      const html = `
        <article class="${cls}">
          <div class="bubble">${escapeHTML(item.text)}</div>
          <div class="meta">${escapeHTML(namePart)} ${escapeHTML(timePart)}</div>
        </article>
      `;
      messagesEl.insertAdjacentHTML("beforeend", html);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function inviteLink(roomId, accessKey) {
      return `${location.origin}${location.pathname}#room=${encodeURIComponent(roomId)}&key=${encodeURIComponent(accessKey)}`;
    }

    function parseInvite(value) {
      try {
        const url = new URL(value.trim());
        if (url.origin !== location.origin || url.pathname !== location.pathname) return null;
        const params = new URLSearchParams(url.hash.slice(1));
        const roomId = params.get("room") || "";
        const accessKey = params.get("key") || "";
        if (!/^room-[a-f0-9]{32}$/.test(roomId) || !/^[a-f0-9]{64}$/.test(accessKey)) return null;
        return { roomId, accessKey };
      } catch (_err) {
        return null;
      }
    }

    function joinRoom(reconnecting = false) {
      const selectedInvite = reconnecting ? activeInvite : parseInvite(roomInput.value);
      const userName = nameInput.value.trim();
      if (!selectedInvite) {
        setStatus("请粘贴完整邀请链接；单独房间号无法加入");
        return;
      }
      if (!userName) {
        setStatus("请填写昵称");
        return;
      }
      const { roomId, accessKey } = selectedInvite;
      socket.emit("join_room", { roomId, userName, accessKey }, (res) => {
        if (!res || !res.ok) {
          setStatus((res && res.error) || "进入房间失败");
          return;
        }
        connectedRoom = roomId;
        connectedName = userName;
        activeInvite = selectedInvite;
        const link = inviteLink(roomId, accessKey);
        roomInput.value = link;
        history.replaceState(null, "", link);
        localStorage.setItem("chat_name", userName);
        messagesEl.innerHTML = "";
        (res.history || []).forEach(msg => renderMessage(msg, msg.from === connectedName));
        setStatus(`已进入房间 ${roomId}`);
      });
    }

    connectBtn.addEventListener("click", () => joinRoom());

    createRoomBtn.addEventListener("click", () => {
      socket.emit("create_room", (res) => {
        if (!res || !res.ok) return setStatus((res && res.error) || "创建房间失败");
        connectedRoom = "";
        connectedName = "";
        messagesEl.innerHTML = "";
        activeInvite = null;
        roomInput.value = inviteLink(res.roomId, res.accessKey);
        history.replaceState(null, "", roomInput.value);
        setStatus("房间已创建。填写昵称进入聊天，并复制邀请链接发给对方。");
      });
    });

    copyLinkBtn.addEventListener("click", async () => {
      const invite = parseInvite(roomInput.value);
      if (!invite) {
        setStatus("请先创建房间或粘贴完整邀请链接");
        return;
      }
      const link = inviteLink(invite.roomId, invite.accessKey);
      try {
        await navigator.clipboard.writeText(link);
        setStatus("邀请链接已复制，发给聊天对象即可");
      } catch (_err) {
        setStatus(`复制失败，请手动复制：${link}`);
      }
    });

    clearBtn.addEventListener("click", () => {
      nameInput.value = "";
      roomInput.value = "";
      activeInvite = null;
      history.replaceState(null, "", location.pathname);
      connectedRoom = "";
      connectedName = "";
      socket.disconnect();
      socket.connect();
      messagesEl.innerHTML = "";
      setStatus("已清空输入");
    });

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = textInput.value.trim();
      if (!connectedRoom || !connectedName) {
        setStatus("请先进入聊天");
        return;
      }
      if (!text) return;

      socket.emit("send_message", { text }, (res) => {
        if (!res || !res.ok) setStatus((res && res.error) || "发送失败");
        else textInput.value = "";
      });
    });

    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    socket.on("message", (message) => {
      renderMessage(message, message.from === connectedName);
    });

    socket.on("system", (message) => {
      renderMessage({ ...message, system: true }, false);
    });

    socket.on("connect", () => {
      if (connectedRoom && connectedName && activeInvite) joinRoom(true);
      else setStatus("服务器已连接，请创建房间或打开邀请链接");
    });

    socket.on("disconnect", () => {
      setStatus("服务器连接断开，等待重连");
    });
  </script>
</body>
</html>
