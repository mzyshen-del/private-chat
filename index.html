<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私域实时聊天</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #718096;
      --brand: #12805c;
      --line: #e4e9f0;
      --me: #daf3e8;
      --shadow: 0 10px 28px rgba(16, 24, 40, 0.12);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 0%, #dff2ea, transparent 30%), var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(900px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: min(92vh, 760px);
      overflow: hidden;
    }

    .top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    input, button, textarea {
      font: inherit;
    }

    input {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    .secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .status {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .messages {
      padding: 14px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(180deg, #fafdfb 0%, #f3f7fb 100%);
    }

    .msg {
      max-width: 80%;
      display: grid;
      gap: 4px;
    }

    .msg .bubble {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 11px;
      word-break: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    .msg .meta {
      font-size: 11px;
      color: var(--muted);
    }

    .msg.me {
      align-self: flex-end;
      justify-items: end;
    }

    .msg.me .bubble {
      background: var(--me);
      border-color: #bfe5d6;
    }

    .msg.system {
      align-self: center;
      justify-items: center;
      max-width: 100%;
    }

    .msg.system .bubble {
      background: #f1f5f9;
      font-size: 12px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 130px;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="top">
      <div style="font-weight:700;">私域实时聊天（可分享链接）</div>
      <div class="row">
        <input id="nameInput" placeholder="你的昵称" maxlength="24" />
        <input id="roomInput" placeholder="房间号（例如：vip-2026）" maxlength="40" />
        <button id="connectBtn" type="button">进入聊天</button>
      </div>
      <div class="row">
        <button id="createRoomBtn" class="secondary" type="button">随机房间</button>
        <button id="copyLinkBtn" class="secondary" type="button">复制邀请链接</button>
        <button id="clearBtn" class="secondary" type="button">清空当前输入</button>
      </div>
    </section>

    <div class="status" id="status">未连接</div>
    <section class="messages" id="messages"></section>

    <form class="composer" id="composer">
      <textarea id="textInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button type="submit">发送</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const roomInput = document.getElementById("roomInput");
    const connectBtn = document.getElementById("connectBtn");
    const createRoomBtn = document.getElementById("createRoomBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const textInput = document.getElementById("textInput");

    const socket = io();
    let connectedRoom = "";
    let connectedName = "";

    const savedName = localStorage.getItem("chat_name") || "";
    const params = new URLSearchParams(location.search);
    const roomFromUrl = params.get("room") || "";

    nameInput.value = savedName;
    roomInput.value = roomFromUrl;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function escapeHTML(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderMessage(item, mine) {
      const cls = item.system ? "msg system" : (mine ? "msg me" : "msg");
      const namePart = item.system ? "系统" : item.from;
      const timePart = formatTime(item.time || new Date().toISOString());
      const html = `
        <article class="${cls}">
          <div class="bubble">${escapeHTML(item.text)}</div>
          <div class="meta">${escapeHTML(namePart)} ${escapeHTML(timePart)}</div>
        </article>
      `;
      messagesEl.insertAdjacentHTML("beforeend", html);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function randomRoom() {
      return `room-${Math.random().toString(36).slice(2, 8)}`;
    }

    connectBtn.addEventListener("click", () => {
      const roomId = roomInput.value.trim().toLowerCase();
      const userName = nameInput.value.trim();
      if (!roomId || !userName) {
        setStatus("请先输入昵称和房间号");
        return;
      }

      localStorage.setItem("chat_name", userName);
      const nextUrl = `${location.pathname}?room=${encodeURIComponent(roomId)}`;
      history.replaceState(null, "", nextUrl);
      messagesEl.innerHTML = "";

      socket.emit("join_room", { roomId, userName }, (res) => {
        if (!res || !res.ok) {
          setStatus((res && res.error) || "进入房间失败");
          return;
        }
        connectedRoom = roomId;
        connectedName = userName;
        setStatus(`已进入房间 ${roomId}`);
        (res.history || []).forEach(msg => renderMessage(msg, msg.from === connectedName));
      });
    });

    createRoomBtn.addEventListener("click", () => {
      roomInput.value = randomRoom();
    });

    copyLinkBtn.addEventListener("click", async () => {
      const roomId = roomInput.value.trim().toLowerCase();
      if (!roomId) {
        setStatus("先填写房间号再复制链接");
        return;
      }
      const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(roomId)}`;
      try {
        await navigator.clipboard.writeText(link);
        setStatus("邀请链接已复制，发给聊天对象即可");
      } catch (_err) {
        setStatus(`复制失败，请手动复制：${link}`);
      }
    });

    clearBtn.addEventListener("click", () => {
      nameInput.value = "";
      roomInput.value = "";
      setStatus("已清空输入");
    });

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = textInput.value.trim();
      if (!connectedRoom || !connectedName) {
        setStatus("请先进入聊天");
        return;
      }
      if (!text) return;

      socket.emit("send_message", { text }, (res) => {
        if (!res || !res.ok) {
          setStatus((res && res.error) || "发送失败");
        }
      });
      textInput.value = "";
    });

    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    socket.on("message", (message) => {
      renderMessage(message, message.from === connectedName);
    });

    socket.on("system", (message) => {
      renderMessage({ ...message, system: true }, false);
    });

    socket.on("connect", () => {
      setStatus("服务器已连接，请输入昵称和房间号");
    });

    socket.on("disconnect", () => {
      setStatus("服务器连接断开，等待重连");
    });
  </script>
</body>
</html>
